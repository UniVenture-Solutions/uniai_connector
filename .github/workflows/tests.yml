name: Connector compatibility
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e . 'sql-metadata==3.0.1'
      - run: python -m pip check
      - run: python -m unittest discover -s uniai_connector/tests -v
      - name: Verify Frappe SQL parser compatibility
        run: python -c 'from sql_metadata import Parser; assert Parser("SELECT name FROM tabCustomer").tables == ["tabCustomer"]'
